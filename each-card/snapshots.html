<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute Stats</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

  --bg:#F7F0E8;

  --time:#F2E5D7;
  --travel:#F5E0CC;
  --life:#EFE2D3;
  --snap:#EADFD8;

  --text:#5F4B3E;
  --muted:#8B7462;

  --shadow:
    0 10px 30px rgba(92,71,52,.08);
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:transparent;
  font-family:'Fraunces',serif;
}

.widget-stage{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.header{
  text-align:center;
  margin-bottom:8px;
}

.card::before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  top: 27px;
  right:-20px;

  background:#cbb7e87b;
  border-radius:60% 40% 55% 45%;

  animation:blob1 12s ease-in-out infinite;
}

/* CARD */
.card{
  margin:0;
  overflow:hidden;

  width:416px;
  position:relative;

  flex-shrink:0;

  transform-origin:center center;

  padding:24px;
  border-radius:28px;
  background:var(--snap);
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.card .border{
  position:absolute;

  inset:12px;

  border:2px dashed rgba(95,75,62,.12);

  border-radius:20px;

  pointer-events:none;
}
.card .sparkle1{
  position:absolute;

  top:94px;
  left:30px;

  font-size:22px;

  color:#B79FD8;

  animation:spinSparkle1 10s linear infinite;
}
.card .sparkle2{
  position:absolute;

  bottom:10px;
  right:40px;

  font-size:22px;

  color:#B79FD8;

  animation:spinSparkle2 10s linear infinite;
}
@keyframes spinSparkle1{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}
@keyframes spinSparkle2{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}
.card::after{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  bottom:-30px;
  left:-20px;

  border-radius:50% 50% 40% 60%;

  background:#cbb7e87b;

  animation:blob2 9s ease-in-out infinite;
}
@keyframes blob1{

  0%,100%{
    transform:
      rotate(0deg)
      translateY(0px);
  }

  50%{
  transform:
    rotate(180deg)
    translateY(18px)
    scale(1.08);
}
}

@keyframes blob2{

  0%,100%{
    border-radius:50% 50% 40% 60%;
    transform:translateX(0);
  }
  
  50%{
    transform:
    translateX(20px)
    translateY(-10px)
    scale(1.12);
}
}

/* TITLE */
h1{
  display:inline-block;
  background-color:#FBF7F180;
  padding:0px 100px;
  border-radius:10px;
  margin-bottom:18px;
  color:#5F4B3E;
  font-family:'Fraunces',serif;
  
  font-size:28px;

  font-weight:500;

  margin-bottom:28px;

  color:var(--text);
}

.emphasis{
  font-weight:700;
}

.hero{
  font-family:'Fraunces',serif;
  font-size:clamp(60px,10vw,92px);

  font-weight:700;

  line-height:.92;

  letter-spacing:-2px;
  color:#8B7462;
  margin-bottom:10px;

}
.hero-label{
  margin-top:8px;
  font-size:15px;
  opacity:.7;
}
.snapshot-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.snapshot-item{
  background:rgba(255,255,255,.28);
  border-radius:22px;
  padding:16px;

  color:var(--text);
}
.snapshot-title{

  margin-top:12px;

  font-size:12px;

  color:var(--text);

  text-transform:uppercase;

  letter-spacing:.08em;

  opacity:.6;
}

.snapshot-value{

  font-size:42px;

  margin-top:4px;

  letter-spacing:-1px;
}

.snapshot-date{
  font-size:18px;
  font-style: italic;
  opacity:.65;

  margin-top:8px;


  font-weight:500;
  font-family:'Manrope',serif;

  color:var(--text);

}
.snapshot-item:nth-child(1){
  background:#FBF7F180;
}

.snapshot-item:nth-child(2){
  background:#FBF7F180;
}

.snapshot-item:nth-child(3){
  background:#FBF7F180;
}

.snapshot-item:nth-child(4){
  background:#FBF7F180;
}

.stat-stack{
  margin-top:24px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.stat-value{
  font-size:30px;
  font-weight:800;
}

.stat-label{
  font-size:20px;
  display: inline-flex;
  opacity:.7;
  color: var(--muted);
}

/* we can fix it */
.mini-card{
  background:#FBF7F180;
  display: inline-flex;
  backdrop-filter:blur(8px);
  border-radius:22px;
  padding:8px;
  margin-top: 10px;
  width: 150px;
}
.mini-pill{
  display:inline-flex;
  align-items:center;

  padding:4px 10px;
  margin:0 4px;

  background:rgba(255,255,255,.45);
  backdrop-filter:blur(8px);

  border-radius:999px;

  vertical-align:middle;
}


.mini-number{
  font-size:30px;
  display:inline-flex;
  font-weight:800;
  color:var(--text);
}

.mini-pill .mini-number{
  font-size:0.7em;
  line-height:1;
  margin:0;
}
/* we can fix it */

.header,
h1,
.mini-card,
.snapshot-date,
.snapshot-grid,
.snapshot-item,
h1{
  position:relative;
  z-index:2;
}

/* we can fix it */

</style>
</head>

<body>
<div class="widget-stage">
  <div class="card" id="card">
    <div class="sparkle1">✦</div>
    <div class="sparkle2">✦</div>
    <div class="border"></div>
  <h1>Snapshots</h1>
    <div class="snapshot-grid">

      <div class="snapshot-item">
        <div class="snapshot-title">Longest Shift</div>
        <div class="snapshot-value" id="longestShift">--</div>
        <div class="snapshot-date" id="longestShiftDate">--</div>
      </div>

      <div class="snapshot-item">
        <div class="snapshot-title">Most Expensive Uber Day</div>
        <div class="snapshot-value" id="mostExpensiveUber">--</div>
        <div class="snapshot-date" id="mostExpensiveUberDate">--</div>
      </div>

      <div class="snapshot-item">
        <div class="snapshot-title">Shortest Shift</div>
        <div class="snapshot-value" id="shortestShift">--</div>
        <div class="snapshot-date" id="shortestShiftDate">--</div>
      </div>

      <div class="snapshot-item">
        <div class="snapshot-title">Cheapest Uber Day</div>
        <div class="snapshot-value" id="cheapestUber">--</div>
        <div class="snapshot-date" id="cheapestUberDate">--</div>
      </div>

    </div>
    </div>
    

</div>

<script>

const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vSp5DknacRo5BImdHw4NZdL2FUGBRh4hZvotLQkupglrML0JV7gg1MvfY46lHrQ5kW66Ur-WQZvQ3Y3/pub?gid=286953219&single=true&output=csv';

function parseCSV(text){

  const rows = [];
  let row = [];
  let value = '';
  let insideQuotes = false;

  for(let i=0;i<text.length;i++){

    const char = text[i];
    const next = text[i+1];

    if(char === '"'){

      if(insideQuotes && next === '"'){
        value += '"';
        i++;
      }else{
        insideQuotes = !insideQuotes;
      }

    }else if(char === ',' && !insideQuotes){

      row.push(value);
      value='';

    }else if((char === '\n' || char === '\r') && !insideQuotes){

      if(value !== '' || row.length){

        row.push(value);
        rows.push(row);

        row=[];
        value='';
      }

    }else{
      value += char;
    }
  }

  return rows;
}

function getValue(map,key){
  return map[key]?.value || '';
}

function getExtra(map,key){
  return map[key]?.extra || '';
}

async function loadData(){

  try{

    const response = await fetch(CSV_URL);
    const csv = await response.text();

    const rows = parseCSV(csv);

    const map = {};

    rows.forEach(r=>{
      map[r[0]] = {
        value:r[1] || '',
        extra:r[2] || ''
      };
    });

    document.getElementById('longestShift').textContent =
      getValue(map,'Longest shift');

    document.getElementById('longestShiftDate').textContent =
      getExtra(map,'Longest shift');

    document.getElementById('shortestShift').textContent =
      getValue(map,'Shortest shift');

    document.getElementById('shortestShiftDate').textContent =
      getExtra(map,'Shortest shift');

    document.getElementById('mostExpensiveUber').textContent =
      getValue(map,'Most Expensive Uber Day');

    document.getElementById('mostExpensiveUberDate').textContent =
      getExtra(map,'Most Expensive Uber Day');

    document.getElementById('cheapestUber').textContent =
      getValue(map,'Cheapest Uber Day');

    document.getElementById('cheapestUberDate').textContent =
      getExtra(map,'Cheapest Uber Day');


    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';

  }catch(err){

    console.error(err);

    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';

  }

}

function updatePeanut(percent){

  const peanut = document.getElementById('peanut');

  peanut.style.setProperty(
    '--carpool',
    Math.max(0, Math.min(100, percent))
  );

}
function scaleCard(){

  const card = document.getElementById('card');

  const DESIGN_WIDTH = 464;
  const DESIGN_HEIGHT = 455;

  const availableWidth =
    document.documentElement.clientWidth;

  const availableHeight =
    document.documentElement.clientHeight;

  const scaleX =
    availableWidth / DESIGN_WIDTH;

  const scaleY =
    availableHeight / DESIGN_HEIGHT;

  const scale =
    Math.min(scaleX, scaleY);

  card.style.transform =
    `scale(${Math.min(scale,1)})`;
}
window.addEventListener('resize', scaleCard);
window.addEventListener('load', scaleCard);
loadData();

</script>

</body>
</html>
